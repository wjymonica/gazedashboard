server {
    listen 80;
    server_name 68.183.60.46;

    # Frontend root
    root /var/www/gazedashboard;
    index index.html;

    # Increase client body size for large uploads
    client_max_body_size 500M;
    
    # Optimize buffer sizes
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Serve static files with correct MIME types
    location / {
        try_files $uri $uri/ /index.html;
        
        # Ensure correct MIME types for JS modules
        location ~* \.js$ {
            add_header Content-Type application/javascript;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        location ~* \.css$ {
            add_header Content-Type text/css;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Backend API - general endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        
        # Enable buffering for non-video requests
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Optimize video streaming with range requests
    location ~ ^/api/(video|quickview) {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        
        # Critical headers for range requests
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Disable buffering for video streaming (improves start time)
        proxy_buffering off;
        proxy_cache off;
        
        # Long timeouts for video
        proxy_read_timeout 3600;
        proxy_connect_timeout 10;
        proxy_send_timeout 3600;
        
        # TCP optimizations for streaming
        tcp_nodelay on;
        tcp_nopush off;
        
        # Enable range requests
        proxy_force_ranges on;
        
        # Cache control for videos
        add_header Cache-Control "public, max-age=3600";
        add_header Accept-Ranges bytes;
    }
}

